<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FlourTrack logo</title>
  <desc id="desc">A stopwatch with a blue timing swipe and playful flour sparkle particles.</desc>
  <defs>
